# Use postgres/example user/password credentials

services:
  db:
    build:
      context: .
      dockerfile: DB_Dockerfile
    image: my_postgre_db
    restart: unless-stopped
    # set shared memory limit when using docker compose
    shm_size: 128mb
    # or set shared memory limit when deploy via swarm stack
    #volumes:
    #  - type: tmpfs
    #    target: /dev/shm
    #    tmpfs:
    #      size: 134217728 # 128*2^20 bytes = 128Mb
    #environment:
    #  POSTGRES_USER: sa
    #  POSTGRES_PASSWORD: example
    env_file: ".env"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - backend

  pqAdmin:
    image: dpage/pgadmin4
    restart: unless-stopped
    env_file: ".env"
    ports:
      - 81:80
    networks:
      - backend

  app:
    build: 
      context: ./Backend
      dockerfile: ./Dockerfile
    image: treeshopmanagingsystem:latest
    restart: unless-stopped
    env_file: ".env"
    depends_on: 
      db:
        condition: service_healthy
    networks:
      - frontend
      - backend
  
  frontend:
    build:
      context: ./Frontend
      dockerfile: ./Dockerfile
    image: frontend:latest
    env_file: ".env"
    restart: unless-stopped
    networks:
      - frontend
    ports: 
      - 3000:3000

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge

volumes:
  pgdata:
